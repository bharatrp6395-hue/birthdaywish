<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday My Love</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e, #fecfef);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 90%;
      max-width: 700px;
      background: rgba(255, 255, 255, 0.2);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      text-align: center;
      color: #fff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      animation: fadeIn 1.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      margin-top: 10px;
      line-height: 1.6;
    }

    .button {
      margin-top: 30px;
      padding: 12px 30px;
      font-size: 1.1rem;
      background: #fff;
      color: #ff6f91;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    .button:hover {
      transform: scale(1.08);
      background: #ffe6f2;
    }

    #wish {
      margin-top: 25px;
      font-size: 1.5rem;
      color: #ffffff;
      display: none;
      animation: pop 0.6s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      color: #ff5fa2;
      font-size: 20px;
      animation: floatUp 5s linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh); }
      100% { transform: translateY(-10vh); }
    }
  </style>
</head>
<body>

  <div class="hearts" id="hearts"></div>

  <div class="card">
    <h1>Happy Birthday, My Love ❤️</h1>
    <p>Meri jaan ho tum kyu tension leti ho m kahi jaunga humesha sath rahunga luv u mera baccha ❤️😘</p>

    <button class="button" onclick="showWish()">Click for Surprise 🎁</button>

    <p id="wish">Ek gift h aapke liye aap milna tb denge decide to na h pr dunga m abhi k liye virtual way m meri jaan ko happy birthdayyyyyyyyyyyyyyyyyyyyyyyy😘😘😘😘😘😘😘😘😘😘 💖</p>
    <img src="love.jpg" alt="Memory " width="300px">
  </div>

  <script>
    function showWish() {
      document.getElementById("wish").style.display = "block";
    }

    function createHearts() {
      const heartsContainer = document.getElementById("hearts");

      for (let i = 0; i < 20; i++) {
        let heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 10 + "px";
        heart.style.animationDuration = Math.random() * 3 + 3 + "s";
        heartsContainer.appendChild(heart);
      }
    }

    createHearts();
  </script>

</body>
</html>
